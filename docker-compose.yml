version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: trading_journal_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: trading_journal
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d trading_journal"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
